<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Carlos Varela">
  <style>
    .bg{fill:#ffffff}
    .name{fill:#1f2328}
    .sub{fill:#656d76}
    .acc{fill:#e5532d}
    .rule{stroke:#d0d7de}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .name{fill:#f0f6fc}
      .sub{fill:#8b949e}
      .rule{stroke:#30363d}
    }
  </style>
  <rect class="bg" width="900" height="220" rx="12"/>
  <text class="name" x="56" y="110" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700">Carlos Varela</text>
  <rect class="acc" x="56" y="132" width="48" height="4" rx="2"/>
  <text class="sub" x="56" y="170" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18">simple and elegant solutions to real problems</text>
  <line class="rule" x1="56" y1="196" x2="844" y2="196"/>
</svg>
